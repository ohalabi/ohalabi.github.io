# Weekly: pull publications from ORCID, and if anything changed, rebuild
# the site and commit. GitHub Pages then redeploys from main as usual.
# Run on demand from the Actions tab via "Run workflow".
name: Sync publications from ORCID

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC (06:00 Doha)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync from ORCID
        run: python scripts/sync_orcid.py

      # build.py stamps today's date into sitemap.xml, so rebuilding
      # unconditionally would commit every week. Only rebuild when the
      # publication data itself changed.
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- Data/publications_orcid.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No publication changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild site
        if: steps.diff.outputs.changed == 'true'
        run: python scripts/build.py

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync publications from ORCID"
          git push
